project_name: siglock

before:
  hooks:
    - go mod tidy

builds:
  - id: siglock
    main: .
    binary: siglock
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.builddate={{.Date}}

archives:
  - id: siglock
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}
      {{- end }}
    format: tar.gz
    files:
      - none*  # не включаем ничего лишнего

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

# Отключаем публикацию, пока не готовы
release:
  draft: true  # ← сначала делаем draft!
  prerelease: auto
